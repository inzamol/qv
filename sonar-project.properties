sonar.projectKey=inzamol_qv
sonar.organization=inzamol

# Paths to source directories
sonar.sources=src
sonar.tests=tests
sonar.inclusions=src/**
sonar.test.inclusions=tests/**

# Exclude example directories, mock projects, and documentation from all analysis (security, bugs, smells, coverage)
sonar.exclusions=examples/**,**/examples/**,docs/**,**/docs/**,dev_docs/**,**/dev_docs/**
sonar.test.exclusions=examples/**,**/examples/**
sonar.coverage.exclusions=examples/**,**/examples/**,tests/**,**/tests/**

# Suppress false positives on dynamic package version resolution in GitHub Action
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e1.resourceKey=action.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=yaml:S6332
sonar.issue.ignore.multicriteria.e2.resourceKey=action.yml
