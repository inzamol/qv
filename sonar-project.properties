sonar.projectKey=inzamol_qv
sonar.organization=inzamol

# Paths to source directories
sonar.sources=src
sonar.tests=tests
sonar.inclusions=src/**
sonar.test.inclusions=tests/**

# Exclude example directories, mock projects, and documentation from all analysis (security, bugs, smells, coverage)
sonar.exclusions=examples/**,**/examples/**,docs/**,**/docs/**,dev_docs/**,**/dev_docs/**
sonar.test.exclusions=examples/**,**/examples/**
sonar.coverage.exclusions=examples/**,**/examples/**,tests/**,**/tests/**
