[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-qv"
version = "0.1.3"
description = "Diagnose why a Python project is unhealthy — explain root cause and suggest safe fixes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Inzamul Hoque" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "packaging>=23.2",
    "pydantic>=2.5.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/inzamol/qv"
Repository = "https://github.com/inzamol/qv"
Documentation = "https://inzamol.github.io/qv/"
Issues = "https://github.com/inzamol/qv/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "tox>=4.15.0",
    "tox-uv>=1.7.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7.0",
]

[project.scripts]
qv = "qv.cli.main:cli"
python-qv = "qv.cli.main:cli"
pydoctor = "qv.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/qv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.qv]
[tool.qv.rules]
DEP-001 = "error"
DEP-002 = "error"
DEP-003 = "warning"
DEP-004 = "warning"
DEP-005 = "warning"
IMP-001 = "error"
IMP-002 = "error"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "examples",
    ".venv",
]

[tool.qv.paths]
exclude = [
    ".venv",
    "build",
    "dist",
    "node_modules",
    "examples",
]
