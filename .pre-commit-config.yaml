repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: qv-scan
        name: qv health scan
        entry: uv run qv scan
        language: system
        args: [--strict, --offline]
        pass_filenames: false
        always_run: true
