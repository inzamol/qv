repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check & fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: qv-scan
        name: qv health scan
        entry: uv run qv scan
        args: [--strict, --offline]
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|requirements.*\.txt|src/.*|tests/.*)
        stages: [pre-commit]

      - id: pytest-check
        name: pytest test suite
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pyright-check
        name: pyright typecheck
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
