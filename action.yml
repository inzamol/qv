name: "qv"
description: "Python project health and diagnostics for GitHub Actions"
author: "Inzamul Hoque"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  path:
    description: "Path to the Python project directory to analyze"
    required: false
    default: "."

  version:
    description: "Version of python-qv to use ('latest', specific version like '1.0.0', or 'local' to use repository source)"
    required: false
    default: "latest"

  python-version:
    description: "Python version used to run qv"
    required: false
    default: "3.12"

  format:
    description: "Output format ('sarif', 'terminal', 'json', 'html', 'text')"
    required: false
    default: "sarif"

  output:
    description: "Output file for report"
    required: false
    default: "qv-results.sarif"

  fail-on:
    description: "Finding severity that causes the workflow to fail ('error', 'warning', 'none')"
    required: false
    default: "error"

  github-annotations:
    description: "Emit GitHub Actions workflow command annotations (::error, ::warning)"
    required: false
    default: "true"

  offline:
    description: "Disable remote vulnerability and CVE queries (airgapped mode)"
    required: false
    default: "false"

  baseline:
    description: "Path to baseline file to suppress pre-existing findings"
    required: false
    default: ""

  args:
    description: "Additional qv CLI arguments"
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Path to the generated SARIF file"
    value: ${{ steps.run-qv.outputs.sarif-file }}

  findings:
    description: "Total number of diagnostic findings detected (populated for sarif or json formats)"
    value: ${{ steps.run-qv.outputs.findings }}

  errors:
    description: "Total number of error findings detected (populated for sarif or json formats)"
    value: ${{ steps.run-qv.outputs.errors }}

  warnings:
    description: "Total number of warning findings detected (populated for sarif or json formats)"
    value: ${{ steps.run-qv.outputs.warnings }}

  exit-code:
    description: "Exit code returned by qv"
    value: ${{ steps.run-qv.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install qv
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$INPUT_VERSION" = "latest" ] || [ -z "$INPUT_VERSION" ]; then
          python -m pip install --upgrade python-qv
        elif [ "$INPUT_VERSION" = "local" ] || [ "$INPUT_VERSION" = "." ]; then
          python -m pip install "$ACTION_PATH"
        else
          python -m pip install "python-qv==$INPUT_VERSION"
        fi

    - name: Run qv
      id: run-qv
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_GITHUB_ANNOTATIONS: ${{ inputs.github-annotations }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ARGS: ${{ inputs.args }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python "$ACTION_PATH/scripts/run_action.py"
