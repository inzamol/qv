name: "qv"
description: "Python project health and diagnostics for GitHub Actions"
author: "Inzamul Hoque"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  path:
    description: "Path to the Python project directory to analyze"
    required: false
    default: "."

  version:
    description: "Version of python-qv to use (pinned version like '1.0.1', 'latest', or 'local' to use repository source)"
    required: false
    default: "1.0.1"

  python-version:
    description: "Python version used to run qv"
    required: false
    default: "3.12"

  format:
    description: "Output format ('sarif', 'terminal', 'json', 'html', 'text')"
    required: false
    default: "sarif"

  output:
    description: "Output file for report"
    required: false
    default: "qv-results.sarif"

  fail-on:
    description: "Finding severity that causes the workflow to fail ('error', 'warning', 'none')"
    required: false
    default: "error"

  github-annotations:
    description: "Emit GitHub Actions workflow command annotations (::error, ::warning)"
    required: false
    default: "true"

  offline:
    description: "Disable remote vulnerability and CVE queries (airgapped mode)"
    required: false
    default: "false"

  baseline:
    description: "Path to baseline file to suppress pre-existing findings"
    required: false
    default: ""

  args:
    description: "Additional qv CLI arguments"
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Path to the generated SARIF file"
    value: ${{ steps.run-qv.outputs.sarif-file }}

  findings:
    description: "Total number of diagnostic findings detected (populated for sarif or json formats)"
    value: ${{ steps.run-qv.outputs.findings }}

  errors:
    description: "Total number of error findings detected (populated for sarif or json formats)"
    value: ${{ steps.run-qv.outputs.errors }}

  warnings:
    description: "Total number of warning findings detected (populated for sarif or json formats)"
    value: ${{ steps.run-qv.outputs.warnings }}

  exit-code:
    description: "Exit code returned by qv"
    value: ${{ steps.run-qv.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install qv
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$INPUT_VERSION" = "local" ] || [ "$INPUT_VERSION" = "." ]; then
          if [ ! -d "$ACTION_PATH/src" ]; then
            echo "::error::version=local requires $ACTION_PATH/src" >&2
            exit 1
          fi
          python -m pip install --only-binary=:all: "click==8.1.8" "rich==13.9.4" "packaging==24.2" "pydantic==2.10.6" "tomlkit==0.13.2" "tomli==2.2.1"  # NOSONAR
          echo "Installed qv from local source ($ACTION_PATH/src)"
        elif [ "$INPUT_VERSION" = "latest" ]; then
          RESOLVED_VER=$(python -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/python-qv/json', timeout=10).read())['info']['version'])" 2>/dev/null || true)
          if [ -z "$RESOLVED_VER" ]; then
            echo "::error::Failed to resolve latest python-qv version from PyPI. Please specify an explicit version (e.g. version: '1.0.1') or check network connectivity." >&2
            exit 1
          fi
          python -m pip install --only-binary=:all: "python-qv==$RESOLVED_VER"  # NOSONAR
          echo "Installed python-qv version: $RESOLVED_VER"
        else
          TARGET_VER="${INPUT_VERSION:-1.0.1}"
          python -m pip install --only-binary=:all: "python-qv==$TARGET_VER"  # NOSONAR
          echo "Installed python-qv version: $TARGET_VER"
        fi

    - name: Run qv
      id: run-qv
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_GITHUB_ANNOTATIONS: ${{ inputs.github-annotations }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ARGS: ${{ inputs.args }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python "$ACTION_PATH/scripts/run_action.py"
