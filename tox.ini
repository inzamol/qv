[tox]
min_version = 4.0
env_list =
    py310
    py311
    py312
    py313
    lint
    typecheck
    docs
isolated_build = true

[testenv]
description = Run the test suite with pytest under {envname}
package = wheel
wheel_build_env = .pkg
extras =
    dev
commands =
    pytest {posargs}

[testenv:lint]
description = Run ruff code quality and format checks
skip_install = true
deps =
    ruff>=0.4.0
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
description = Run pyright static type analysis
extras =
    dev
commands =
    pyright

[testenv:docs]
description = Build documentation with mkdocs
extras =
    docs
commands =
    mkdocs build --strict
