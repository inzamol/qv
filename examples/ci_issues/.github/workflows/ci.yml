name: Build and Deploy

# CI-006: Missing concurrency cancellation group
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # CI-001: Missing OS or Python matrix dimension
      matrix:
        node: [18]
    steps:
      # CI-003: Deprecated/outdated action pin
      - uses: actions/checkout@v2

      # CI-003: Outdated setup-python version
      - uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      # CI-002: Unfrozen/unpinned dependency installation
      # CI-005: Hardcoded token/secret
      - name: Install Dependencies
        env:
          GH_TOKEN: ghp_1234567890abcdef1234567890abcdef1234
        run: |
          pip install requests pytest
          echo "Done"

      # CI-004: Missing quality gates (no tests or linter run in workflow)
