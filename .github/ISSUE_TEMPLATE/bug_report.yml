name: "Bug Report"
description: Report crashes, incorrect diagnostics, missing findings, or unsafe fixes in QV.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve QV's reliability!

        Search existing issues before submitting. Never include credentials,
        access tokens, private source code, or other sensitive information.

  - type: dropdown
    id: bug_type
    attributes:
      label: Bug Category
      description: What kind of problem did you encounter?
      options:
        - Incorrect diagnostic / false positive
        - Missing diagnostic / false negative
        - Incorrect severity or confidence
        - Incorrect or unsafe automated fix
        - Crash or unhandled exception
        - Incorrect CLI output or exit code
        - Performance or memory issue
        - Installation or compatibility issue
        - Other
    validations:
      required: true

  - type: input
    id: rule_id
    attributes:
      label: Rule ID
      description: Applicable to diagnostic-related issues; leave blank if unknown or not applicable.
      placeholder: "DEP-007"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the problem and its impact.
      placeholder: |
        QV reports that a dependency is unused, but the package
        is loaded dynamically through the application's plugin system.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should QV do instead?
      placeholder: |
        QV should recognize the configured plugin entry point
        or report that dependency usage cannot be determined reliably.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: Include the diagnostic message, file, line, or unexpected change.
      placeholder: |
        DEP-007 reports the package as unused and recommends removal.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide the exact command and the smallest example that reproduces the issue.
      placeholder: |
        Command:
        qv scan .

        Project structure:
        .
        ├── pyproject.toml
        └── src/
            └── app.py

        Relevant code or configuration:
        # Add a minimal, redacted example here.

        Expected result:
        # Describe the expected finding or behavior.

        Actual result:
        # Describe what QV actually reports.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting Evidence
      description: For inaccurate or missing diagnostics, explain why the finding is wrong or what QV failed to detect.
      placeholder: |
        The package is registered through a plugin entry point
        in pyproject.toml and loaded dynamically at runtime.
      render: text
    validations:
      required: false

  - type: textarea
    id: command_output
    attributes:
      label: Command Output or Error Trace
      description: Paste relevant output, stack traces, or the reported diagnostic.
      render: text
      placeholder: Paste redacted output here.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact and Workaround
      description: Explain the practical impact and any workaround.
      placeholder: |
        Impact: The recommendation could remove a required dependency.
        Workaround: Exclude the package from the relevant check.
    validations:
      required: false

  - type: dropdown
    id: package_manager
    attributes:
      label: Package Manager
      options:
        - uv
        - Poetry
        - pip / requirements.txt
        - PDM
        - Pipenv
        - Other
        - None / Not applicable
    validations:
      required: true

  - type: input
    id: qv_version
    attributes:
      label: QV Version
      description: Output of qv version, if available.
      placeholder: "qv 0.1.0"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: "Python 3.12.7"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System and Relevant Framework Versions
      placeholder: "Ubuntu 24.04, FastAPI 0.x"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      options:
        - label: I searched for existing issues.
          required: true
        - label: I verified the behavior on the latest QV version, or identified the affected version.
          required: true
        - label: I removed credentials and sensitive information from the report.
          required: true
