name: Publish to PyPI & GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository (pypi or testpypi)"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Tag, Lint & Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Validate Git Tag vs Package Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run python -c "
          import os, sys
          from pathlib import Path
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          tag = os.environ.get('GITHUB_REF_NAME', '')
          if not tag.startswith('v'):
              sys.exit(0)
          tag_ver = tag.lstrip('v')

          # Floating major tags (e.g. v1, v2) are GitHub Action release tags, not PyPI package releases
          if tag_ver.isdigit() or '.' not in tag_ver:
              print(f'Skipping PyPI package validation for Action major tag: {tag}')
              sys.exit(0)

          pyproject = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          toml_ver = pyproject.get('project', {}).get('version', '')

          from qv import __version__ as code_ver

          errors = []
          if tag_ver != toml_ver:
              errors.append(f'Git tag version ({tag_ver}) != pyproject.toml version ({toml_ver})')
          if tag_ver != code_ver:
              errors.append(f'Git tag version ({tag_ver}) != qv.__version__ ({code_ver})')

          if errors:
              for err in errors:
                  print(f'::error::{err}')
              sys.exit(1)
          print(f'✓ Tag {tag} strictly matches pyproject.toml and qv.__version__ ({tag_ver})')
          "

      - name: Lint and formatting checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Static type checking
        run: uv run pyright

      - name: Run test suite with coverage
        run: uv run pytest --cov=src/qv --cov-report=term-missing

  build:
    name: Build, Attest & Release Assets
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata with Twine
        run: uvx twine check --strict dist/*

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Store built packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Create or Update GitHub Release with Notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: contains(github.ref, '-')

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    if: (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')) || (github.event_name == 'release' && github.event.action == 'published' && contains(github.ref, '.')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-qv
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/python-qv
    permissions:
      id-token: write # Mandatory for Trusted Publishing (OIDC)

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
